version: '3.8'

services:
  # Database Service (MySQL / PostgreSQL)
  database:
    image: mysql:8.0
    container_name: hospital_db
    restart: siempre
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: hospital_management
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # Backend Service (Node.js / Express or Python FastAPI)
  backend:
    image: node:18-alpine
    container_name: hospital_backend
    working_dir: /app
    restart: always
    depends_on:
      - database
    environment:
      - DB_HOST=database
      - DB_USER=root
      - DB_PASS=rootpassword
      - DB_NAME=hospital_management
    ports:
      - "5000:5000"
    command: sh -c "echo 'Backend API service ready for deployment' && tail -f /dev/null"

  # Frontend Service (React.js)
  frontend:
    image: node:18-alpine
    container_name: hospital_frontend
    working_dir: /app
    restart: always
    ports:
      - "3000:3000"
    command: sh -c "echo 'Frontend service ready for deployment' && tail -f /dev/null"

volumes:
  db_data:
